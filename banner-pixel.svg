    <rect x="260" y="55" width="250" height="195" fill="#1d2557"/>
    <rect x="268" y="63" width="234" height="179" fill="#080f33"/>
    <rect x="268" y="63" width="234" height="12" fill="#1b2468"/>
    <rect x="274" y="67" width="5" height="5" fill="#ff5f56"/>
    <rect x="283" y="67" width="5" height="5" fill="#ffbd2e"/>
    <rect x="292" y="67" width="5" height="5" fill="#27c93f"/>
    <text x="282" y="96" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#00f5ff">ACCURACY 98.7%<animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="282" y="111" font-family="Consolas,'Courier New',monospace" font-size="10" fill="#8b949e">epoch 42/100  loss 0.0042</text>
    <g stroke="#2f5bff" stroke-opacity="0.25">
      <line x1="282" y1="132" x2="494" y2="132"/>
      <line x1="282" y1="150" x2="494" y2="150"/>
    </g>
    <polyline points="282,160 306,148 330,152 354,138 378,142 402,128 426,134 450,122 474,126 494,118" fill="none" stroke="#ffd23f" stroke-width="3" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" values="260;0;0;260" keyTimes="0;0.55;0.9;1" dur="5s" repeatCount="indefinite"/>
