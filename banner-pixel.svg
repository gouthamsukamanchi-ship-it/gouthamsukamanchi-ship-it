<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" shape-rendering="crispEdges" role="img" aria-label="Pixel art: a little robot watching three big monitors while sipping coffee - Goutham Sukamanchi, AI/ML Engineer in Training">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f33"/>
      <stop offset="1" stop-color="#141047"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="420" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- wall -->
    <rect width="1000" height="420" fill="url(#wall)"/>
    <rect y="40" width="1000" height="10" fill="#ffffff" opacity="0.02"/>
    <rect y="150" width="1000" height="10" fill="#ffffff" opacity="0.02"/>
    <rect y="260" width="1000" height="10" fill="#ffffff" opacity="0.02"/>
    <!-- ceiling light strip -->
    <rect x="0" y="0" width="1000" height="5" fill="#00f5ff">
      <animate attributeName="fill" values="#00f5ff;#7b5cff;#ff3df2;#7b5cff;#00f5ff" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- shelf with items (top right) -->
    <rect x="770" y="140" width="150" height="8" fill="#6b4a3a"/>
    <rect x="770" y="148" width="150" height="3" fill="#ff3df2">
      <animate attributeName="fill" values="#ff3df2;#00f5ff;#ffd23f;#ff3df2" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="782" y="120" width="22" height="20" fill="#c5603a"/>
    <rect x="786" y="98" width="6" height="22" fill="#2ee66b"/>
    <rect x="795" y="90" width="6" height="30" fill="#1fbf58"/>
    <rect x="803" y="102" width="6" height="18" fill="#2ee66b"/>
    <rect x="828" y="128" width="40" height="12" fill="#2f5bff"/>
    <rect x="830" y="116" width="36" height="12" fill="#ff3df2"/>
    <rect x="886" y="126" width="22" height="14" fill="#ffd23f"/>
    <rect x="896" y="114" width="12" height="14" fill="#ffd23f"/>
    <rect x="908" y="120" width="7" height="5" fill="#ff8a3d"/>
    <rect x="901" y="118" width="3" height="3" fill="#0b1546"/>

    <!-- monitor glows -->
    <rect x="28"  y="68" width="224" height="194" fill="#2f5bff" opacity="0.12" filter="url(#glow)"><animate attributeName="opacity" values="0.07;0.18;0.07" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="248" y="43" width="274" height="219" fill="#ff3df2" opacity="0.10" filter="url(#glow)"><animate attributeName="opacity" values="0.18;0.07;0.18" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="518" y="68" width="224" height="194" fill="#2ee66b" opacity="0.10" filter="url(#glow)"><animate attributeName="opacity" values="0.07;0.16;0.07" dur="2.8s" repeatCount="indefinite"/></rect>

    <!-- MONITOR 1: code -->
    <rect x="40" y="80" width="200" height="170" fill="#1d2557"/>
    <rect x="48" y="88" width="184" height="154" fill="#080f33"/>
    <rect x="48" y="88" width="184" height="12" fill="#1b2468"/>
    <rect x="54" y="92" width="5" height="5" fill="#ff5f56"/>
    <rect x="63" y="92" width="5" height="5" fill="#ffbd2e"/>
    <rect x="72" y="92" width="5" height="5" fill="#27c93f"/>
    <rect x="60"  y="112" height="6" width="0" fill="#00f5ff"><animate attributeName="width" values="0;120;120;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="70"  y="128" height="6" width="0" fill="#ff3df2"><animate attributeName="width" values="0;90;90;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="70"  y="144" height="6" width="0" fill="#2ee66b"><animate attributeName="width" values="0;130;130;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="80"  y="160" height="6" width="0" fill="#ffd23f"><animate attributeName="width" values="0;70;70;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect x="70"  y="176" height="6" width="0" fill="#7b9bff"><animate attributeName="width" values="0;110;110;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="80"  y="192" height="6" width="0" fill="#00f5ff"><animate attributeName="width" values="0;80;80;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="2.5s" repeatCount="indefinite"/></rect>
    <rect x="60"  y="208" height="6" width="0" fill="#ff3df2"><animate attributeName="width" values="0;50;50;0" keyTimes="0;0.4;0.9;1" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
    <rect x="130" y="208" width="8" height="6" fill="#ffffff"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="132" y="250" width="16" height="40" fill="#2a2f66"/>
    <rect x="110" y="286" width="60" height="5" fill="#2a2f66"/>

